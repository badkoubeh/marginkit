# All hooks are `local` with `language: system`, matching zeta-bench's convention and running
# the same ruff and mypy that the `dev` extra installs. Nothing is pinned to an upstream mirror
# tag, so the versions here cannot drift from the versions CI and `/pre-pr-check` use.
#
# pytest is deliberately absent. The 90% coverage gate belongs in CI, not in a commit hook.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict, src only)
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
